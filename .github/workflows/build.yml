name: build-dexkit

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"
      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon
      - name: Verify entry class is packaged
        run: |
          python3 - <<'EOF'
          import sys, zipfile
          ok = True
          for apk in ("app/build/outputs/apk/debug/app-debug.apk",
                      "app/build/outputs/apk/release/app-release-unsigned.apk"):
              z = zipfile.ZipFile(apk)
              joined = b"".join(z.read(n) for n in z.namelist() if n.endswith(".dex"))
              found = b"Lio/github/xalsace/qqbypass/XposedEntry;" in joined
              print(apk, "dex bytes:", len(joined), "XposedEntry present:", found)
              ok = ok and found
          sys.exit(0 if ok else 1)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: qqbypass-dexkit-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: qqbypass-dexkit-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
